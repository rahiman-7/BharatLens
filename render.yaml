services:
  - type: web
    name: bharatlens-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    plan: starter
    disk:
      name: bharatlens-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:////var/data/bharatlens.db
      - key: ENABLE_NEWS_SCHEDULER
        value: "true"
      - key: NEWS_INGEST_INTERVAL_MINUTES
        value: "60"
      - key: NEWS_INGEST_ON_STARTUP
        value: "false"
      - key: REGIONAL_NEWS_MAX_REQUESTS_PER_CYCLE
        value: "1"
      - key: SHOW_DEMO_ARTICLES
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false
